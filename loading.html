<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial HoloNet — Connecting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    .loader {
      width: 100%;
      min-height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      position: relative;
    }

    .scanline {
      position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 3px,
        rgba(255,255,255,0.015) 3px,
        rgba(255,255,255,0.015) 4px
      );
      animation: flicker 6s infinite;
    }
    @keyframes flicker {
      0%,100% { opacity: 1; }
      88%      { opacity: 1; }
      88.5%    { opacity: 0.7; }
      89%      { opacity: 1; }
      95%      { opacity: 1; }
      95.4%    { opacity: 0.8; }
      95.8%    { opacity: 1; }
    }

    .sweep {
      position: absolute; left: 0; right: 0; height: 80px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.025), transparent);
      pointer-events: none;
      animation: sweep 4s linear infinite;
    }
    @keyframes sweep { 0%{top:-80px;} 100%{top:100%;} }

    .cog-wrap {
      position: relative;
      width: 100px; height: 100px;
      animation: spin 8s linear infinite;
      z-index: 2;
    }
    @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

    .text-block { text-align: center; z-index: 2; }
    .empire-line { font-size: 10px; letter-spacing: 6px; color: #444; margin-bottom: 8px; }
    .title-line  { font-size: 20px; letter-spacing: 5px; color: #ccc; margin-bottom: 4px; text-shadow: 0 0 20px rgba(255,255,255,0.12); }
    .sub-line    { font-size: 9px; letter-spacing: 4px; color: #2a2a2a; }

    .progress-wrap  { width: 320px; z-index: 2; }
    .progress-label {
      font-size: 9px; letter-spacing: 3px; color: #444;
      margin-bottom: 6px; display: flex; justify-content: space-between;
    }
    .progress-track { height: 2px; background: #0d0d0d; border: 1px solid #1a1a1a; position: relative; overflow: hidden; }
    .progress-fill  { height: 100%; background: #555; width: 0%; transition: width 0.3s ease; }

    .status-lines { width: 320px; z-index: 2; }
    .status-line  { font-size: 9px; letter-spacing: 2px; color: #2a2a2a; margin-bottom: 5px; opacity: 0; transition: opacity 0.3s; }
    .status-line.visible { opacity: 1; color: #555; }
    .ok     { color: #3a6a3a; }
    .cursor-line { font-size: 9px; letter-spacing: 2px; color: #333; margin-top: 4px; }
    .blink  { animation: blink 0.8s step-end infinite; }
    @keyframes blink { 50%{opacity:0;} }

    .redirect-msg {
      font-size: 9px; letter-spacing: 3px; color: #3a6a3a;
      opacity: 0; transition: opacity 0.5s; z-index: 2;
    }
    .redirect-msg.visible { opacity: 1; }
  </style>
</head>
<body>
<div class="loader">
  <div class="scanline"></div>
  <div class="sweep"></div>

  <div class="cog-wrap">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
      <circle cx="50" cy="50" r="46" stroke="#222" stroke-width="2" fill="#000"/>
      <circle cx="50" cy="50" r="33" stroke="#2a2a2a" stroke-width="1.5" fill="none"/>
      <circle cx="50" cy="50" r="14" stroke="#333" stroke-width="2" fill="#0a0a0a"/>
      <circle cx="50" cy="50" r="5"  fill="#444"/>
      <g stroke="#222" stroke-width="2">
        <line x1="50" y1="4"  x2="50" y2="17"/>
        <line x1="50" y1="83" x2="50" y2="96"/>
        <line x1="4"  y1="50" x2="17" y2="50"/>
        <line x1="83" y1="50" x2="96" y2="50"/>
        <line x1="17.5" y1="17.5" x2="26.5" y2="26.5"/>
        <line x1="73.5" y1="73.5" x2="82.5" y2="82.5"/>
        <line x1="82.5" y1="17.5" x2="73.5" y2="26.5"/>
        <line x1="26.5" y1="73.5" x2="17.5" y2="82.5"/>
      </g>
    </svg>
  </div>

  <div class="text-block">
    <div class="empire-line">GALACTIC EMPIRE</div>
    <div class="title-line">IMPERIAL HOLONET</div>
    <div class="sub-line">CORUSCANT-PRIME // SECURE NODE</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>INITIALISING SECURE SESSION</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="bar"></div>
    </div>
  </div>

  <div class="status-lines">
    <div class="status-line" id="s1">&gt; HOLONET UPLINK <span class="ok">[ESTABLISHED]</span></div>
    <div class="status-line" id="s2">&gt; ENCRYPTION LAYER <span class="ok">[ACTIVE]</span></div>
    <div class="status-line" id="s3">&gt; ISB CLEARANCE CHECK <span class="ok">[VERIFIED]</span></div>
    <div class="status-line" id="s4">&gt; DOCUMENT REGISTRY <span class="ok">[LOADED]</span></div>
    <div class="status-line" id="s5">&gt; SESSION AUTHENTICATED <span class="ok">[GRANTED]</span></div>
    <div class="cursor-line"><span class="blink">_</span></div>
  </div>

  <div class="redirect-msg" id="rdmsg">&gt; REDIRECTING TO COMMAND PORTAL...</div>
</div>

<script>
  var bar  = document.getElementById('bar');
  var pct  = document.getElementById('pct');
  var rdmsg = document.getElementById('rdmsg');

  var steps = [
    { pct: 18,  delay: 500,  id: 's1' },
    { pct: 35,  delay: 1300, id: 's2' },
    { pct: 52,  delay: 2100, id: 's3' },
    { pct: 72,  delay: 2900, id: 's4' },
    { pct: 91,  delay: 3700, id: 's5' },
    { pct: 100, delay: 4400, id: null }
  ];

  var current = 0;

  function animateTo(target) {
    var now = parseInt(bar.style.width) || 0;
    if (now >= target) return;
    now++;
    bar.style.width = now + '%';
    pct.textContent = now + '%';
    if (now < target) requestAnimationFrame(function(){ animateTo(target); });
  }

  steps.forEach(function(step) {
    setTimeout(function() {
      animateTo(step.pct);
      if (step.id) {
        document.getElementById(step.id).classList.add('visible');
      }
    }, step.delay);
  });

  // Show redirect message then navigate
  setTimeout(function() {
    rdmsg.classList.add('visible');
  }, 4800);

  setTimeout(function() {
    window.location.href = 'https://galacticempireroleplay.github.io/DocPortal/';
  }, 5800);
</script>
</body>
</html>
